<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#002E5D">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BYU Tree Finder</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23002E5D'/%3E%3Cpath d='M16 5c4.4 0 8 3.4 8 7.7 0 3.9-3 7.1-6.8 7.6V27h-2.4v-6.7C11 19.8 8 16.6 8 12.7 8 8.4 11.6 5 16 5Z' fill='%237BBE72'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,500;0,7..72,700;1,7..72,400&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#002E5D; --leaf:#3E7D3A; --leaf-soft:#E3EFDF;
  --btn:#002E5D; --btn-ink:#fff; --gray-btn:#ECEEEB;
  --shadow:0 1px 2px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.08);
  --paper:#FBFCF8; --ink:#1F2A33; --muted:#5E6B74; --line:#D9DED6;
  --me:#1A73E8; --near:#E8A33D;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#141A17;--ink:#E7ECE6;--muted:#9AA79F;--line:#2C3630;--leaf-soft:#22331F;--leaf:#7BBE72;--navy:#7FA9D6;--btn:#2F6DB5;--btn-ink:#fff;--gray-btn:#262C29;--shadow:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.3);color-scheme:dark}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{font-family:var(--sans);color:var(--ink);background:#dfe6dc;overflow:hidden;-webkit-tap-highlight-color:transparent}
#map{position:fixed!important;left:0;right:0;top:0;bottom:var(--mapB,130px);z-index:0}
@media (prefers-color-scheme:dark){body{background:#242f3e}}
.leaflet-container{background:#dfe6dc;font-family:var(--sans)}

/* top bar */
.top{position:fixed;left:0;right:0;top:0;z-index:500;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;gap:8px;pointer-events:none}
.top>*{pointer-events:auto}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:0 14px;height:44px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:transparent;font:500 16px var(--sans);color:var(--ink);outline:none;min-width:0}
.search svg{flex:none;color:var(--muted)}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);display:grid;place-items:center;box-shadow:var(--shadow);cursor:pointer}
.iconbtn.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.search:focus-within{border-color:var(--navy)}
.iconbtn:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.results{position:fixed;z-index:600;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 60px);max-height:50vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);display:none}
.results button{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:10px 14px;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;cursor:pointer}
.results button:last-child{border-bottom:0}
.results b{font:600 16px var(--serif)}
.results i{display:block;font:italic 13px var(--serif);color:var(--muted)}
.results .d{font:600 14px var(--sans);font-variant-numeric:tabular-nums;color:var(--muted)}

/* bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:500;background:var(--paper);border-radius:20px 20px 0 0;box-shadow:0 -1px 0 var(--line),0 -2px 12px rgba(0,0,0,.08);padding:0 16px calc(env(safe-area-inset-bottom,0px) + 14px);max-height:82vh;display:flex;flex-direction:column;transform:translateY(var(--sheetY,0px));transition:transform .3s cubic-bezier(.2,.8,.2,1);will-change:transform}
.sheet.dragging{transition:none}
.sheet-top{flex:none;touch-action:none;user-select:none;-webkit-user-select:none}
.grab{flex:none;width:100%;height:24px;margin:0 0 4px;border:0;padding:0;background:none;cursor:grab;touch-action:none;display:grid;place-items:center}
.grab::before{content:"";width:36px;height:4px;border-radius:2px;background:var(--line)}
.compass{flex:none;display:grid;grid-template-columns:86px 1fr;gap:14px;align-items:center;cursor:pointer;border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit;width:100%}
.dial{width:86px;height:86px;border-radius:50%;border:3px solid var(--line);position:relative;display:grid;place-items:center;transition:border-color .3s,background .3s}
.dial svg{transition:transform .25s ease-out}
.dial .card{position:absolute;top:3px;left:50%;transform:translateX(-50%);font:600 10px var(--sans);color:var(--muted)}
#sheet.nofix .dial,#sheet.nofix .dist{display:none}
#sheet.nofix .compass{grid-template-columns:1fr}
.dial.here{border-color:var(--leaf);background:var(--leaf-soft)}
.dial img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);border-radius:50%;object-fit:cover;object-position:50% 40%;display:none}
.orbit{position:absolute;inset:-3px;display:none;pointer-events:none;transition:transform .25s ease-out}
.orbit i{position:absolute;left:50%;top:-8px;margin-left:-11px;width:0;height:0;border:11px solid transparent;border-top:0;border-bottom:17px solid var(--navy);filter:drop-shadow(0 0 1.5px var(--paper))}
.dial.photo img,.dial.photo .orbit{display:block}
.dial.photo #arrow,.dial.photo .card,.dial.here .orbit{display:none}
.dist{font:500 14px/1.3 var(--sans);color:var(--muted);font-variant-numeric:tabular-nums;margin-top:5px}
.dist span{margin-left:3px}
.dist:empty{display:none}
.tname{font:700 23px/1.15 var(--serif)}
.sci{font:italic 400 15px var(--serif);color:var(--muted);margin-top:2px}
.status{font-size:14px;color:var(--muted);margin-top:2px}
.status:empty{display:none}
.hereBadge{display:inline-block;margin-top:6px;font:600 13px var(--sans);color:#fff;background:#3E7D3A;padding:3px 10px;border-radius:12px}
.actions{flex:none;display:flex;gap:8px;margin-top:12px}
.morebtn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:42px;margin-top:12px;border:0;border-radius:10px;background:var(--gray-btn);color:var(--ink);font:600 15px var(--sans);cursor:pointer}
.morebtn svg{transition:transform .25s}.sheet.open .morebtn svg{transform:rotate(180deg)}
.btn{flex:1;height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 15px var(--sans);cursor:pointer}
a.btn{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.more{flex:1 1 auto;min-height:0;overflow:auto;margin-top:12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.near h3,.detail h3{font:600 13px var(--sans);color:var(--muted);margin:4px 0 6px}
.rowwrap{display:flex;align-items:center;border-top:1px solid var(--line)}
.rowwrap .row{border-top:0;flex:1;min-width:0}
.go{flex:none;width:44px;height:44px;display:grid;place-items:center;color:var(--muted);border-radius:50%}
.row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;width:100%;padding:9px 0;border:0;border-top:1px solid var(--line);background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.row b{font:600 16px var(--serif)}
.row i{display:block;font:italic 13px var(--serif);color:var(--muted)}
.row .d{font:600 15px var(--sans);font-variant-numeric:tabular-nums;color:var(--muted)}
.row svg{color:var(--leaf)}
.detail p{font:400 16px/1.6 var(--serif);margin:6px 0 10px}
.detail .meta{font-size:14px;color:var(--muted)}
.detail a{color:var(--navy);font-weight:600}
.hero{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:50% 35%;border-radius:10px;background:var(--line);margin:0 0 12px}
.tabs{position:sticky;top:0;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper);border-bottom:1px solid var(--line);margin:0 0 12px}
.tabs button{border:0;background:none;padding:11px 0;font:600 15px var(--sans);color:var(--muted);cursor:pointer}
.tabs button[aria-selected=true]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--navy)}
.facts{width:100%;border:1px solid var(--line);border-radius:12px;border-collapse:separate;border-spacing:0;overflow:hidden;margin:0 0 14px;font-size:15px}
.facts th,.facts td{padding:11px 14px;border-top:1px solid var(--line);vertical-align:top}
.facts tr:first-child th,.facts tr:first-child td{border-top:0}
.facts th{text-align:left;font-weight:400;color:var(--muted);white-space:nowrap}
.facts td{text-align:right;font-weight:600}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pgrid a{display:block;color:var(--muted)!important;font-weight:400!important;text-decoration:none}
.pgrid img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--line)}
.pgrid span{display:block;font-size:12px;line-height:1.3;margin-top:4px}
.more[data-tab=about] .near,.more[data-tab=photos] .near{display:none}
.err{background:#FFF3E0;color:#6B3E00;border-radius:10px;padding:10px 12px;font-size:14px;margin-top:10px;display:none}
@media (prefers-color-scheme:dark){.err{background:#3A2A12;color:#F5D7A8}}

/* markers */
.tmark{width:16px;height:16px;border-radius:50%;background:var(--leaf);border:2.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25);transition:transform .2s}
.tmark.target{background:var(--near);transform:scale(1.45)}
.tmark.dim{opacity:.35}
.mewrap{position:relative;width:22px;height:22px}
.me{position:absolute;inset:0;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15),0 2px 6px rgba(0,0,0,.3)}
.cone{position:absolute;left:50%;top:50%;width:0;height:0;transform-origin:0 0;display:none}
.cone::before{content:"";position:absolute;left:-22px;top:-46px;width:44px;height:46px;background:radial-gradient(ellipse at 50% 100%,rgba(26,115,232,.45),rgba(26,115,232,0) 70%);clip-path:polygon(50% 100%,0 0,100% 0)}
.leaflet-control-attribution{font-size:10px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="top">
  <label class="search">

</div>
<div class="results" id="results" role="listbox"></div>

<section class="sheet nofix" id="sheet" aria-label="Tree details">

      <img id="dialImg" alt="">
      <div class="orbit" id="orbit" aria-hidden="true"><i></i></div>
    </div>
    <div>
      <div class="tname" id="tname">Find trees near you</div>
      <div class="sci" id="sci"></div>
      <div class="dist" id="dist"></div>
      <div class="status" id="status">Use your location to find the closest tree, or tap a dot on the map.</div>
      <div id="badge"></div>
    </div>
  </button>
  <div class="actions" id="actions">
    <button class="btn primary" id="locBtn">Use my location</button>
  </div>
  <button class="morebtn" id="moreBtn" hidden aria-controls="more" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg><span id="moreLabel">Photos and details</span></button>

  </div>
</section>

e":"Aristocrat Pear ","scientificName":"Pyrus calleryana 'Aristocrat'","latitude":40.2467816667,"longitude":-111.6505538889,"mainImage":"1206.JPG","treeTypeId":96,"tourRouteNumber":null},{"id":100,"commonName":"Columnar Beech","scientificName":"Fagus sylvatica 'Fastigiata'","latitude":40.2464475,"longitude":-111.6489016667,"mainImage":null,"treeTypeId":97,"tourRouteNumber":null},{"id":101,"commonName":"Tricolor Beech","scientificName":"Fagus sylvatica 'Roseo-Marginata'","latitude":40.2468577778,"longitude":-111.6488252778,"mainImage":"1067.jpg","treeTypeId":98,"tourRouteNumber":null},{"id":102,"commonName":"European Beech","scientificName":"Fagus sylvatica","latitude":40.2471397222,"longitude":-111.6488083333,"mainImage":"1025.jpg","treeTypeId":99,"tourRouteNumber":null},{"id":103,"commonName":"Sweet Hackberry","scientificName":"Celtis laevigata","latitude":40.2470005556,"longitude":-111.6485761111,"mainImage":null,"treeTypeId":100,"tourRouteNumber":null},{"id":104,"commonName":"Bristlecone Pine","scientificName":"Pinus aristata","latitude":40.2476336111,"longitude":-111.6490938889,"mainImage":null,"treeTypeId":101,"tourRouteNumber":null},{"id":105,"commonName":"Green Atlas Cedar","scientificName":"Cedrus atlantica","latitude":40.2476477778,"longitude":-111.6489677778,"mainImage":"1030.jpg","treeTypeId":102,"tourRouteNumber":null},{"id":106,"commonName":"White Fir","scientificName":"Abies concolor","latitude":0.2481763889,"longitude":-111.6486911111,"mainImage":"180.jpg","treeTypeId":103,"tourRouteNumber":null},{"id":109,"commonName":"Bosnian Red Cone Pine ","scientificName":"Pinus leucodermis","latitude":40.2487533333,"longitude":-111.6480402778,"mainImage":null,"treeTypeId":106,"tourRouteNumber":null}],"types":{"3":{"id":3,"commonName":"Jeffrey Pine","scientificName":"Pinus jeffreyi","family":"Pinaceae","description":"Boasting the largest pine cones on campus (up to 9”), this is a great tree to begin our tour.  Planted about 1970, this Jeffery pine has long, slightly twisted needles in groups of three. Similar to ponderosa pine, it can reach over 60’ in height.  Native from southern Oregon to California.","cultivar":""},"4":{"id":4,"commonName":"Austrian Pine","scientificName":"Pinus nigra","family":"Pinaceae","description":"A native of Eastern Europe from Austria to Greece, this drought-tolerant tree is the most commonly planted pine along the Wasatch Front. A picturesque tree of excellent form, it grows about 60 ft tall with a spread of half the height or more. Needles are 4-6&quot; long in groups of two.","cultivar":""},"5":{"id":5,"commonName":"Paperbark Maple","scientificName":"Acer griseum","family":"Aceraceae","description":"This diminuative tree (&lt;20 ft) does well in full sun, or in partial shade, and is ideal for small areas. It is adaptable to a variety of soil types, but does not tolerate drought or soil compaction. A valued feature is the papery, cinnamon-brown bark that peels away in thin sheets. This tree also displays glorious yellow to red fall color.","cultivar":""},"6":{"id":6,"commonName":"Blue Spruce","scientificName":"Picea pungens","family":"Pinaceae","description":"A native of the Rocky Mountains, the Blue Spruce (aka Colorado Blue Spruce) is the official state tree of Utah.  It prefers full sun.  Although a great tree, it can be blown over by strong winds due to its dense form and shallow root system.  Blue color is assured only with varieties that are propagated vegetatively (cloned).  While this tree tolerates perio","cultivar":""},"7":{"id":7,"commonName":"Western Catalpa","scientificName":"Catalpa speciosa","family":"Bignoniaceae","description":"This hardy tree withstands extreme heat and cold.  Its most recognizable feature is the cylindrical fruit (8-20” long) that remains on the tree most of the winter. Large, mostly white, bell-shaped flowers bloom in June.  Known for its rapid growth and huge leaves, catalpas can reach 50 ft in height. ","cultivar":""},"8":{"id":8,"commonName":"Cutleaf Birch","scientificName":"Betula pendula Dalecarlica","family":"Betulaceae","description":"This medium-sized oval shaped tree prefers full sun and moderate irrigation.  Its most attractive feature is its striking white bark.  It is a difficult tree to grow in Utah because of heat and drought conditions.  When stressed, white-barked birches are highly susceptible to attack by bronze birch borers, which lead to dieback of branches especially near the top of the tree. A good alternative is the western water birch.  ","cultivar":""},"9":{"id":9,"commonName":"Arborvitae","scientificName":"Thuja occidentalis","family":"Cupressaceae","description":"This plant can be grown as a shrub or a tree. depending on the cultivar, it may reach over 30 ft.  Width also varies widely, but arborvitae generally have a columnar or pyramidal form.  Used heavily for decades, arborvitae is not as popular today as it once was.  However, it is a widely adaptable evergreen that can be used as a screen or in a small area. ","cultivar":""},"10":{"id":10,"commonName":"Eastern Redbud, Judas Tree","scientificName":"Cercis canadensis","family":"Fabaceae","description":"This small tree prefers rich, moist, well-drained soils. It produces beautiful purple-red, pea-shaped flowers during April. Redbuds benefit from regular maintenance pruning due to many densely crossing branches.  They do not tolerate drought conditions and perform best when provided with afternoon shade.","cultivar":""},"11":{"id":11,"commonName":"Silver Linden","scientificName":"Tilia tomentosa","family":"Tiliaceae","description":"This pyramidal tree, which can grow to over 60’, makes a beautiful statement in the landscape. The four to five-inch-long dark green leaves are bright silver and fuzzy beneath, causing the trees to shimmer with each little breeze. In early summer, the trees are perfumed with extremely fragrant clusters of small, yellow/white blossoms that attract large numbers of bees.  The leaves turn yellow before dropping in autumn. Lindens are susceptible to aphid damage, resulting in a glazed, sugary coating on objects beneath the tree. ","cultivar":""},"12":{"id":12,"commonName":"Washington Hawthorn","scientificName":"Crataegus phaenopyrum","family":"Rosaceae","description":"This narrow and round tree is another outstanding small ornamental (&lt;25’) that has something for every season— lustrous green foliage, white spring flowers, bright red berry clusters that persist through much of the winter, and orange to scarlet fall color. This tree adapts to a variety of soils and grows rapidly when young. ","cultivar":""},"13":{"id":13,"commonName":"Bradford Pear","scientificName":"Pyrus calleryana Bradford","family":"Rosaceae","description":"This pyramidal-shaped small to medium tree is the most common of the flowering pears. It has glossy, dark green leaves that change to scarlet and purple in the fall; however, the beautiful white flowers that bloom in spring produce an odor that some find objectionable. Bradford pear is also structurally weak and often splits apart during strong winds or heavy snows. Varieties with superior structure include ‘Redspire,’ ‘Aristocrat,’ and ‘Chanticleer.’  Flowering pears are susceptible to aphids and fireblight. ","cultivar":""},"14":{"id":14,"commonName":"Purple Leaf Plum","scientificName":"Prunus cerasifera Thundercloud","family":"Rosaceae","description":"This small tree is prized for its purple foliage and small white  pink flowers in the spring.  Although not grown for the fruit, it has a heavy crop of edible dark purple plums 1-3 inches in diameter.  These can be messy over a sidewalk or driveway.  Purple leaf plums prefer deep, well drained soil. Weak branch attachments are common and result in splitting as the tree matures. This tree is susceptible to aphids, scales and cytospora, as well as chlorosis. (20’ high x 15’ wide)","cultivar":""},"15":{"id":15,"commonName":"Goldenrain Tree","scientificName":"Koelreuteria paniculata","family":"Sapindaceae","description":"One of the few yellow flowering trees found in the landscape, goldenrains produce branched clusters of blossoms in July.  It grows well in most types of soils and is moderately drought tolerant. Verticillium wilt is occasionally a problem and younger branches are subject to snow damage; otherwise a great choice for a medium round tree.  Another closely related species is the Chinese flame tree. It has very similar leaves and form, but boasts larger flowers in the fall rather then midsummer and produces rose-pink seed pods instead of the golden-brown seed pods of the Goldenrain Tree","cultivar":""},"16":{"id":16,"commonName":"Kentucky Coffee Tree","scientificName":"Gymnocladus dioicus","family":"Fabaceae","description":"This round, irregular-branched tree requires surprisingly little maintenance.  During winter, the bare branches and distinctive bark form a striking silhouette that is quite picturesque. Kentucky Coffee Tree is another very adaptable tree that will do well in a variety of conditions.  This species has separate male and female trees.  Females produce a thick, leathery pod about 4-6 inches long that persists into the winter. ","cultivar":""},"17":{"id":17,"commonName":"Schwedler Maple","scientificName":"Acer plantanoides 'Schwedleri'","family":"Aceraceae","description":"One of the many varieties of Norway Maples found on campus, the Schwedler maple is known for its purplish-red spring foliage that turns dark green in early summer.  Norway Maples are among the most common trees on campus, and are relatively easy to grow if planted correctly.  The tree makes a great medium-large shade tree.","cultivar":""},"18":{"id":18,"commonName":"Little Leaf Linden","scientificName":"Tilia cordata","family":"Tiliaceae","description":"This pyramidal tree is valued for its beautiful symmetrical shape, yellow fall color, and extremely fragrant flowers  around the 4th of July. It is a moderate growing, but long-lived tree that requires little care except where aphids are a concern.  This tree eventually reaches over 45’.  The pea-sized fruits grow in clusters from a curving, leafy bract, which twirl to the ground when they ripen and fall from the tree.","cultivar":""},"19":{"id":19,"commonName":"Red Horsechestnut","scientificName":"Aesculus x carnea","family":"Hippocastanaceae","description":"This tree grows best when planted in rich, moist, well-drained soil.  It is a slow growing tree, valued for its symmetrical outline, attractive red flowers, and medium size. Panicles of 6-inch rose-red blossoms are produced in May, developing slightly prickly capsules that contain a non-edible nut about 1 1/2” in diameter.","cultivar":""},"20":{"id":20,"commonName":"London Plane Tree","scientificName":"Platanus hybrida (x acerifolia)","family":"Platanaceae","description":"The London plane tree is frequently and easily confused with the American sycamore (tree #100 on the tour). Both grow rapidly to be very tall (often &gt; 80’), both have attractive &quot;camouflage&quot; bark that readily exfoliates, both are tolerant of city conditions, and both are considered messy trees because they drop leaves, twigs and fruit.   But the","cultivar":""},"21":{"id":21,"commonName":"Saucer Magnolia","scientificName":"Magnolia soulangiana","family":"Magnoliaceae","description":"One of many spectacular trees originating in Asia, this is a beautiful, small specimen. It produces very large and showy pinkish-white blossoms--some more than 4 inches across. Saucer magnolias prefer a slightly acidic, deep rich loam soil with exposure to full sun or light shade.  This tree may suffer cold injury during extreme Utah winters.","cultivar":""},"22":{"id":22,"commonName":"Weeping European Beech","scientificName":"Fagus sylvatica Pendula","family":"Fagaceae","description":"Slow to leaf out in spring and slow to grow, but “definitely worth the wait!”  Weeping beeches display a fairy tale quality, with branches that head upward briefly only to turn abruptly and cascade back to earth.  This creates a tent-like mass that makes a perfect “hideout”. Said to prefer acidic, well-drained soils, we have observed healthy specimens on rocky clay soils throughout Utah Valley.  Green-leaved beeches may reach 35’ with a variable spread. They do not suffer as much leaf scorch as the purple varieties during hot summer weather, but can get twig and trunk sun scorch when they are exposed.","cultivar":""},"23":{"id":23,"commonName":"Thornless Honeylocust","scientificName":"Gleditsia triacanthos 'Inermis'","family":"Fabaceae","description":"This rapid growing, medium to large tree develops an upright “vase” shape as it matures.  It will withstand adverse climate and soil conditions, plus it requires little care. Honeylocusts are a popular lawn tree since the light shade they cast allows healthy lawn to grow beneath them. Leaves are a medium green and turn an attractive, pale yellow in the fall. The fruit is a 12-18 inch twisted pod with a purple-brown color. ","cultivar":""},"24":{"id":24,"commonName":"White Star Magnolia","scientificName":"Magnolia kobus, var. 'Stellata'","family":"Magnoliaceae","description":"The Star magnolia is probably the most cold-hardy magnolia on campus.  It is a small tree (15-20’) that can be grown like a large shrub with multiple trunks.  Showy white flowers appear in spring before leaves emerge. Generally trouble-free, this plant can tolerate some shade.  Several horticultural cultivars are available.","cultivar":""},"25":{"id":25,"commonName":"Scotch Pine","scientificName":"Pinus sylvestris","family":"Pinaceae","description":"Also known as &#39;Scots Pine&#39;, this pine grows rapidly to attain a very picturesque form as it ages. The immature bark has a distinctive orange or cinnamon color, exfoliating in papery scales.  It is a very hardy tree that tolerates temperature extremes and adapts to a variety of soils, but requires a well-drained soil. It is characteristic for the top of the pine to lean over as it ages, which makes it susceptible to snow damage. Once used widely as a Christmas tree, the tree can reach 70’ in almost as many years.","cultivar":""},"26":{"id":26,"commonName":"Fassen&#39;s Black Maple","scientificName":"Acer platanoides 'Fassen's Black'","family":"Aceraceae","description":"A characteristic of all Norway maples is the milky sap that emerges from petioles when a leaf is picked.  Fassen&#39;s Black is an upright cultivar that is similar in appearance to the &#39;Crimson King&#39;, with the only notable difference being a distinct upward curl of the leaf edges on ‘Fassen’s Black.’ Its deep purplish red leaves give this tree the nickname &quot;Black Maple&quot;. Dark-colored cultivars, which have less chlorophyll than their greener counterparts, grow more slowly but can still reach over 60’ in height. ","cultivar":""},"27":{"id":27,"commonName":"Amur Maple","scientificName":"Acer ginnala","family":"Aceraceae","description":"This small, multi-trunked tree produces green leaves that turn yellow and bright red in the fall. It is often planted in masses to create a natural, rustic feel. Small, yellow, lightly fragrant flowers appear with the leaves in the spring. Leaves may turn a showy yellow to red in the fall. This very hardy tree will tolerate our coldest winters but is very susceptible to iron chlorosis in high-pH soils.  ","cultivar":""},"28":{"id":28,"commonName":"Japanese Maple","scientificName":"Acer palmatum","family":"Aceraceae","description":"This elegant tree is a beautiful specimen for small gardens, entry courtyards, or where a living focal point is needed. However, Japanese maples do not tolerate compacted soil or drought, and need some protection from both hot summer sun and cold winter winds in Utah.  They do much better on the north or east side of a building or where there is filtered sunlight in the afternoon. Dozens of Japanese maple cultivars are available.  They can be grown as a single or multi-stemmed small tree. ","cultivar":""},"29":{"id":29,"commonName":"Ginkgo","scientificName":"Ginkgo biloba","family":"Ginkgoaceae","description":"This pyramidal, slow growing tree can reach heights above 60’ long after you are dead.  As a tree from the dinosaur era, the fan-shaped leaves with parallel veination are worth staring at to take you back a few eons. Ginkgos produce a strong central leader and bright green, fan-shaped leaves that turn a brilliant yellow in the fall.  The leaves hang on quite late into the season, and then drop suddenly together—in 2-3 days.  Female trees produce a very malodorous plum-like fruit, so nearly all landscape plantings specify a male cultivar (‘Autumn Gold’ is perhaps the most popular). This tree grows well in most sites and requires little care. It is a great alternative to quaking aspen. ","cultivar":""},"30":{"id":30,"commonName":"Zelkova","scientificName":"Zelkova serrata","family":"Ulmaceae","description":"Native to China and Taiwan, this large, vase-shaped tree has a short, stout trunk and spreading limbs that separate at head level. It is a rapid growing tree with dark green leaf color that turns yellow to a beautiful rusty red in the fall. Smooth bark covers its straight trunk.  Mature bark is often exfoliating. Its tap root makes it drought and wind tolerant. This tree requires frequent pruning when young to eliminate narrow branch attachments.","cultivar":""},"31":{"id":31,"commonName":"Frontier Elm","scientificName":"Ulmus (carpinifolia x parvifolia) ","family":"Ulmaceae","description":"Recently introduced by the US National Arboretum as a cross between Chinese elm and smooth-leaved elm, the &#39;Frontier&#39; hybrid elm is most noted for its small leaves that produce lovely red-purple autumn colors. This tree is highly tolerant to the fungus that causes Dutch elm disease. Its small size makes it suitable for use in residential landscapes, along city streets, and under power lines, but can still reach up to 40’ at maturity. ","cultivar":""},"32":{"id":32,"commonName":"Columnar Red Maple","scientificName":"Acer rubrum 'Columnare'","family":"Aceraceae","description":"This is a columnar variety of the popular tree found naturally in the eastern United States.  Leaves are green on top and silver below, and turn an excellent orange to deep-red color in the fall. This tree grows best in soils with neutral or acidic pH. ","cultivar":""},"33":{"id":33,"commonName":"Vanderwolf Pine","scientificName":"Pinus flexilis 'Vanderwolf'","family":"Pinaceae","description":"Limber pine is native to high elevations of Utah and surrounding states and was selected for cultivar development by a New Jersey nursery and introduced as ‘Vanderwolf’ pine. This 5-needle pine is graceful (“limber”) and dances in even slight breezes.  It may reach heights of 30’, and limited landscape use of the species so far suggests greater potential along the Wasatch Front.  ","cultivar":""},"34":{"id":34,"commonName":"White Spruce","scientificName":"Picea glauca","family":"Pinaceae","description":"Spruces can be distinguished by pokey needles that arise from raised, woody pegs. Needles of white spruce give off a skunk-like odor when crushed. This tree is pyramidal and grows rapidly when young, but matures to a columnar shape reaching  65’ high and 15’wide. It withstands wind and dryness better than most spruces, but spider mites are a problem in very hot summers.","cultivar":""},"35":{"id":35,"commonName":"Sweetgum","scientificName":"Liquidambar styraciflua","family":"Hamamelidaceae","description":"The unique, star-shaped leaves of this pyramidal tree provide brilliant fall color, ranging from scarlet, orange, and yellow to purple, lilac and brown. The fruit is a persistent, sticky, ball-like structure (1 to 1 1/2 inches in diameter) with numerous claw-like protrusions. Yellow fragrant liquid (sap) exudes from injuries to the bark as well as when leaves are crushed. Iron chlorosis can be a problem unless planted in a deep, moist, slightly acidic soil. Sometimes you can see holes where iron has been injected.  ","cultivar":""},"36":{"id":36,"commonName":"Tamarisk","scientificName":"Tamarix chinensis","family":"Tamaricaceae","description":"This small tree/ large shrub grows rapidly and has become a serious invasive species along many Utah waterways. You probably should not plant it.  That said, it is highly adapted to arid climates and thrives in very saline and nutrient-poor soil. During the spring it can grow as much as one foot per month. It is distinguished by its feathery, scaly leaves and numerous small, pink flowers at the ends of the branches. It spreads readily by seed and by root, trunk, and branch sprouts.","cultivar":""},"37":{"id":37,"commonName":"Chanticleer Pear","scientificName":"Pyrus calleryana 'Chanticleer'","family":"Rosaceae","description":"This cultivar is a better choice than ‘Bradford’, especially for narrow planting spaces.  Chanticlear is somewhat hardier and has a better structure.  Mature specimens have a pyramidal shape and may reach 35’ high but grow to only 15’ wide. Leaves are a dark glossy green during summer, turning to red-purple with traces of yellow in the fall. The white flowers that bloom in early spring develop into and pea-sized pears that are usually eaten by birds during the winter. ","cultivar":""},"38":{"id":38,"commonName":"Red Oak","scientificName":"Quercus rubra","family":"Fagaceae","description":"This large tree is claimed to be the fastest growing oak in North America.  It requires full sun and moderate irrigation. New leaves are red in the spring, turning a lustrous dark green as the season progresses. Fall color is a brilliant combination of oranges and reds. Red oak is fairly hardy and less difficult to transplant than most oaks.  Iron chlorosis is a problem in Utah. (75’ high x 50’ wide)","cultivar":""},"39":{"id":39,"commonName":"European Larch","scientificName":"Larix decidua","family":"Pinaceae","description":"Native to Central Europe, this fine textured tree is both deciduous and coniferous. So when the needles turn yellow and drop as winter approaches, don’t think that the tree has died.   Reaching a height of over 70’, larches retain a strongly pyramidal growth habit with branches that droop as they mature.","cultivar":""},"40":{"id":40,"commonName":"Red Maple","scientificName":"Acer rubrum","family":"Aceraceae","description":"Aptly named, this oval tree has several features that are red at least part of the year:  buds, flowers, twigs, fruits (samaras) and autumn foliage.  The tree grows fairly quickly to a height approaching 50’, but needs moist, well-drained, acidic soil for optimal growth. Most red maples struggle somewhat in Utah due to our typically high pH soils. There are about one dozen cultivars that differ in shape and autumn color.  If you want a local alternative for brilliant fall color, consider using bigtooth maple (Acer grandidentatum #88). ","cultivar":""},"41":{"id":41,"commonName":"Blue Atlas Cedar","scientificName":"Cedrus atlantica 'Glauca'","family":"Pinaceae","description":"This is a beautiful wide-spreading evergreen tree with silvery blue foliage. Blue Atlas Cedar reaches a height of 50’ and a width of 40’, so it needs plenty of space for optimal growth and aesthetic beauty. It is drought tolerant, clean, and requires little care. This tree should be planted in a protected site since it is marginally hardy here. ","cultivar":""},"42":{"id":42,"commonName":"Douglas Fir","scientificName":"Pseudotsuga menziesii","family":"Pinaceae","description":"This native Utah tree has a dense, erect pyramidal form that makes it popular as a Christmas tree.  The tree also works well as a screen or windbreak.  Growth to nearly 60‘ is best in well-drained soils that are moist during the winter.  Distinctive three-lobed bracts resembling a forked dragon’s tongue extend beyond the cone scales.  ","cultivar":""},"43":{"id":43,"commonName":"English Oak","scientificName":"Quercus robur","family":"Fagaceae","description":"English oaks were among the first landscape trees planted on campus.  This broad-shaped tree may take more than your lifetime to reach 70&#39; in height. Dark green leaves hang on late into the autumn and gradually change to a copper color.  Although not particularly fussy about soils, this tree will grow faster in a well-drained, fertile soil.   It is an excellent tree for parks or large areas. Columnar varieties are popular where space is limited. (See #107) ","cultivar":""},"44":{"id":44,"commonName":"Lily Magnolia","scientificName":"Magnolia liliflora","family":"Magnoliaceae","description":"This is a small, delicate magnolia with slightly fragrant, deep red-purple blossoms borne before leaves emerge in the spring. It prefers sun and grows well in moist, well-drained soil. It is an excellent tree for small garden areas, reaching only 15’ high and 10’ wide.","cultivar":""},"45":{"id":45,"commonName":"White Mulberry","scientificName":"Morus alba","family":"Moraceae","description":"This is a round, short-trunked tree with broad-spreading branches. It tolerates heat and drought and is able to thrive in practically any type of soil including compacted soils. Mulberries can require a lot of pruning and produce abundant, messy fruit. Fruitless varieties are available and popular in landscaping. (40’h x 40’w)","cultivar":""},"46":{"id":46,"commonName":"Rose-Leaf Mountain Ash","scientificName":"Sorbus aucuparia","family":"Rosaceae","description":"Often called the &quot;European Mountain Ash&quot;, this oval-shaped tree produces white flowers in May and clusters of orange-red berries during the fall, which attract birds. This tree exhibits beautiful fall color, ranging from yellow to red.  Like many other plants in the rose family, it is prone to fire blight during wet springs. ","cultivar":""},"47":{"id":47,"commonName":"Hedge Maple","scientificName":"Acer campestre","family":"Aceraceae","description":"This small-medium round tree, which may reach 25’, is ideally suited for residential landscapes. Hedge maples grow more slowly than do Norway maples, but the roots are less likely to seriously compete with lawn grasses or lift sidewalks.  This tree tolerates partial shade and periods of drought, and fall color is a beautiful bright yellow.   Many hedge maples have low, dense branches that give a shrub-like appearance if branches are not thinned.  ","cultivar":""},"48":{"id":48,"commonName":"Ohio Buckeye","scientificName":"Aesculus glabra","family":"Hippocastanaceae","description":"This slow to moderate-growing tree (50’h x 30’w) is one of the first trees to leaf out in spring. It produces pale greenish yellow flowers in mid-spring. The tree loses its leaves early in the fall as the leaf color changes from bright green to orange, red and yellow. This ornamental shade tree has an upright oval shape and is suitable for parks and larger residential lots. ","cultivar":""},"49":{"id":49,"commonName":"Silver Maple","scientificName":"Acer saccharinum","family":"Aceraceae","description":"Silver maple gets its name from the underside of the leaf. The tree might appropriately be termed “golden maple” in Utah County, since our alkaline soils result in severely chlorotic leaves. This rapid growing, short-lived tree can reach 80’ in height.  As it matures, limbs will frequently break during windy or snowy weather.  Obviously, large limbs present a potential safety hazard.  This vase-shaped tree unfortunately remains very popular, but is generally not a good choice for a residential site.  ","cultivar":""},"50":{"id":50,"commonName":"Purple Leaf Beech","scientificName":"Fagus sylvatica 'Atropunicea'","family":"Fagaceae","description":"This beautiful, pyramidal tree is one of the many excellent European beeches found on campus. Young leaves are a deep purple-red that change to a purple-green by midsummer. All beeches are difficult to transplant, especially when large. The tree requires adequate moisture and can experience sun scald on the lower trunk if stressed, injured or improperly pruned. Keeping the lower branches on the trunk helps eliminate sun scald. The tree grows to be very large (often greater than 60’) but is an excellent specimen for use in larger areas. ","cultivar":""},"51":{"id":51,"commonName":"Sycamore Maple","scientificName":"Acer pseudoplatanus","family":"Aceraceae","description":"Named after its similar form and leaf shape to the common sycamore, this maple boasts green springtime flowers that hang like clusters of grapes and gradually turn red as fruits mature. So many bees are attracted to the flowers that the tree can literally buzz for a week or so during early summer. This large, round tree (50’h x 50’w) is adaptable to soil moisture, but does not tolerate continuously wet soils. The bark is gray to red-brown, and the leaves are thick and leathery.","cultivar":""},"52":{"id":52,"commonName":"Serbian Spruce","scientificName":"Picea omorika","family":"Pinaceae","description":"This narrow pyramidal tree is one of the most elegant spruces.  It grows 50’ or more yet may only be 15’ wide at the base.  The Serbian Spruce does well in sun to partial shade but requires some protection from the wind. It prefers moist, well-drained soil, although it will grow in sand and heavy clay. It is not drought tolerant and is subject to borers and spider mites after hot, dry weather.","cultivar":""},"53":{"id":53,"commonName":"Sawara False Cypress","scientificName":"Chamaecyparis pisifera","family":"Cupressaceae","description":"This narrow, slow growing evergreen is  popular as an accent in oriental-themed gardens. The bark is scaly or fissured and a reddish-brown color. It has flattened, somewhat pendulous branches. It has moderate drought tolerance. Not a common ornamental tree, especially in Utah. Grows to around 35’ high and 20’ wide\rNOTE: Until further notice, the featured specimen for this tree has been removed. It should be replaced in the near future. ","cultivar":""},"54":{"id":54,"commonName":"Skinner Cutleaf Maple","scientificName":"Acer saccharinum 'Skinneri'","family":"Aceraceae","description":"A popular cultivar of silver maple, this tree has very serrated leaves and large samaras. It displays beautiful yellow fall color, but has all of the problems previously described for silver maple (#47). Grows to 45’ high x 35’ wide with a somewhat weeping, pyramidal form.","cultivar":""},"55":{"id":55,"commonName":"Sakhalin Cork Tree","scientificName":"Phellodendron sachalinense 'Macho'","family":"Rutaceae","description":"This is a single or multi-trunk tree with a broadly vase-shaped crown. Its massive, heavy branching gives an interesting winter appearance. The bark develops a beautiful and unusual cork-like pattern. This cultivar is male only, abortion and therefore free of the foul-smelling fruits found in the female trees of the same species. Grows to 50’h x 35’w.<div","cultivar":""},"56":{"id":56,"commonName":"American Elm","scientificName":"Ulmus americana","family":"Ulmaceae","description":"Some of the oldest American elms in Utah surround the Tabernacle on Temple Square. This tree with its beautiful vase shape was once among the most heavily planted and elegant landscape trees, but it has almost been completely eliminated by Dutch elm disease.  American elms may reach over 70’ if they survive long enough.  Trees at BYU and Temple Square have thus far been protected by trunk injections. Notice the drill holes both at ground level and approximately 3&#39;.","cultivar":""},"57":{"id":57,"commonName":"Deodar Cedar","scientificName":"Cedrus deodara","family":"Pinaceae","description":"This pyramidal beauty is one of the most graceful of all evergreens. It is fast-growing and drought tolerant once established. The drooping branch tips help to identify this tree. Its texture is finer and its color lighter than other cedars. It prefers sun to partial shade and needs protection from wind. (55’h x 35’w)","cultivar":""},"58":{"id":58,"commonName":"Homestead Elm","scientificName":"Ulmus x 'Homestead'","family":"Ulmaceae","description":"In an effort to create beautiful elms resistant to Dutch elm disease, scientists developed this hybrid.  The characteristics of this tree are more like the Siberian elm (#57), with weak wood and lots of seed litter. It is a fast growing and somewhat brittle tree.  Although it is resistant to DED, it lacks the elegant form of the American elm. (55’ x 35’)","cultivar":""},"59":{"id":59,"commonName":"Siberian Elm","scientificName":"Ulmus pumila","family":"Ulmaceae","description":"This species, often mistakenly called Chinese elm (#104) is one of several large, fast-growing trees planted for shade by the pioneers. It is frequently considered a trash or weed tree because it is messy, exudes a smelly sap called “slime flux” from wounds, and is plagued by numerous insect pests. The wood of this tree is weak. It has questionable ornamental value, but is useful for difficult areas where nothing else will grow. The true Chinese elm, found later in this tour, is a cleaner, more landscape friendly tree. (60’h x 35’w)","cultivar":""},"60":{"id":60,"commonName":"Black Locust","scientificName":"Robina pseudoacacia","family":"Fabaceae","description":"This irregular, upright tree grows rapidly to 60’, and is extremely hardy and adaptable. In the spring, it produces pea-like flowers that are white, very fragrant, and quite showy. This variety is not considered a good ornamental because of its invasive nature, weak wood, thorns, and insect problems (especially the locust borer). However, ‘Purple Robe’ is a commonly used ornamental cultivar with a far tamer form. Of historical note, pioneers used the wood to fashion nails for construction.   ","cultivar":""},"61":{"id":61,"commonName":"English Elm","scientificName":"Ulmus procera","family":"Ulmaceae","description":"A European Elm, native from England to central and southern Europe, is pyramidal in shape and can reach a height over 75’. The crown is typically irregular.  Dutch elm disease arrived with the Elm Bark Beetle in lumber shipments of this tree in 1930. This tree is sterile and is reproduced from suckers. It has a nice shape but is not resistant to Dutch elm disease.","cultivar":""},"62":{"id":62,"commonName":"Eastern Redcedar","scientificName":"Juniperus virginiana","family":"Cupressaceae","description":"Often called “red cedar”, this columnar tree is not, in fact, a cedar, but a juniper. It has scale-like leaves that are green to blue-green. A notable characteristic is the strong fragrance you have probably noticed in cedar chests. Many cultivars are available, which vary in form.  Eastern redcedar may reach over 40’ in height.  This tree is suited for low-maintenance landscape situations such as a windbreak or hedge.","cultivar":""},"63":{"id":63,"commonName":"Dawn Redwood","scientificName":"Metasequoia glyptostroboides","family":"Taxodiaceae","description":"Being a deciduous conifer is not the only unusual thing about this tall conical tree.  It was discovered in the fossil record in 1941—the same year living trees were discovered in China!  The soft, feathery needles turn a unique pinkish brown to reddish bronze before dropping as branchlets in the fall. Dawn redwoods can grow rapidly under ideal conditions (full sun, slightly acidic soil, moist well-drained soil), ultimately reaching more than 70’.  Planted in 1962, this specimen is one of the oldest Dawn Redwoods in North America.","cultivar":""},"64":{"id":64,"commonName":"Hawthorn","scientificName":"Crataegus spp.","family":"Rosaceae","description":"Hawthorns are members of the rose family, and traditionally a favorite ornamental tree in temperate climates. Numerous cultivars are available, ranging from very dense shrubs to small trees up to 25 feet in height. Trees are covered with small white flowers in mid to late spring, which mature into pea-sized yellow to red fruits by early autumn. Thorns and pests similar to apple trees (fireblight, spider mites, aphids, leaf miners, tent caterpillars, etc.) can occasionally affect ornamental qualities. Otherwise, hawthorns tend to be easy to grow.","cultivar":""},"65":{"id":65,"commonName":"Ponderosa Pine","scientificName":"Pinus ponderosa","family":"Pinaceae","description":"This picturesque tree grows moderately fast and is very long lived. In natural stands it can reach over 80’, with an open, columnar form.  It is extremely adaptable and can even survive on dry arid slopes. Because of its size, it is best used in parks and other large areas. Bark on younger trees is blackish; older trees have a yellow-brown to cinnamon-red bark. Ponderosa pine has features very similar to the Jeffery pine, but it has smaller cones, shorter and straighter needles, and after a rainstorm the bark smells like vanilla.   ","cultivar":""},"66":{"id":66,"commonName":"Paper Birch","scientificName":"Betula papyrifera","family":"Betulaceae","description":"This short-lived, pyramidal to upright tree grows best in colder climates. It needs moderate irrigation and prefers full sun to partial shade.  Its most outstanding feature is the thin, smooth, chalky white bark that gradually erodes in thin tatters. This tree is generally not suitable for urban landscapes along the Wasatch Front since it is plagued by many diseases and insect pests.  However, it is less susceptible to birch bores than European white birches. (40’h x 30’w)","cultivar":""},"67":{"id":67,"commonName":"Lavalle Hawthorn","scientificName":"Crataegus x lavallei","family":"Rosaceae","description":"This tree produces large quantities of bright orange-red fruits that will attract beautiful birds throughout the winter. The careful observer may actually witness somewhat intoxicated birds in late winter after fruits have fermented. In summer the dark green leaves almost seem artificial with their glossy and plastic-like appearance. Leaves turn bronze in the fall and remain until early winter. Showy white flowers are borne in the spring. This tree tolerates periods of drought and is a nice ornamental standing at approximantely 20&#39;h x 15&#39; w is a nice ornamental if the long thorns are not a concern.","cultivar":""},"68":{"id":68,"commonName":"Horsechestnut","scientificName":"Aesculus hippocastanum","family":"Hippocastanaceae","description":"This large upright tree (50’h x 35’w) has a formal oval shape. Leaf color is dark green, with showy cream-colored flowers appearing in late spring on 5-10 inch long, upright clusters. Due to dense shade, grass is difficult to grow under this tree as it matures.  Flowers mature into a spiny, light green fruit (brown when dry) that holds 2-3 nuts; these nuts are not edible. Horsechestnuts are best suited to moist, well-drained soil and require moderate to heavy irrigation.","cultivar":""},"69":{"id":69,"commonName":"Boxelder","scientificName":"Acer negundo","family":"Aceraceae","description":"A Utah native, this rapid-growing tree is abundant along stretches of the Provo River.  Boxelders are notorious for weak wood that easily breaks during storms.  It is common for huge knots and burls to appear on the trunk and large branches. Boxelder bugs eat the seeds of female trees and can be a nuisance.  Cultivars including ‘Variegatum’, ‘White lightning’ and ‘Flamingo’ have variegated leaves and may reach a smaller mature size, although they are still somewhat brittle. (45’h x 30’w)","cultivar":""},"70":{"id":70,"commonName":"Fremont Cottonwood","scientificName":"Populus fremontii","family":"Salicaceae","description":"This is one of our fastest growing native trees.  It frequents floodplains and river bottoms, where it grows rapidly in full sun.  Weak wood and a host of pests and diseases  limit its usefulness in urban landscapes. This broad tree can reach a height and width of nearly 70’. ","cultivar":""},"71":{"id":71,"commonName":"Arizona Cypress","scientificName":"Cupressus arizonica","family":"Cupressaceae","description":"This pyramidal tree is marginally hardy in Provo and more common in hot desert areas like St. George. It prefers hot climates where it is valued as a wind break or tall screen. It is a drought resistant tree once established, and has potential for greater use in water-conserving landscapes. ","cultivar":""},"72":{"id":72,"commonName":"Limber Pine","scientificName":"Pinus flexilis","family":"Pinaceae","description":"This slow growing, five-needle pine is native to the Rocky Mountains. It is pyramidal-shaped when young but develops a broad, flattened canopy as it matures.  Limber pine grows most successfully in moist, well-drained soils with full sun reaching a size of 35&#39;h x 20&#39;w. Branches and leaves are indeed very limber and wave in the breeze.  Compare this tree with the Vanderwolf Pine (#31).","cultivar":""},"73":{"id":73,"commonName":"Incense Cedar","scientificName":"Calocedrus decurrens","family":"Cupressaceae","description":"Native to the Western U.S., this stately columnar tree has slow-medium growth and tolerates heat and drought.  The flat, shiny, green needles are very aromatic. In the landscape it is often sheared for a formal look. Incense cedars may live more than one thousand years in the wild. (45&#39;h x 10&#39; w)  ","cultivar":""},"74":{"id":74,"commonName":"Giant Sequoia","scientificName":"Sequoiadendron giganteum","family":"Taxodiaceae","description":"Hug this tree!  (We won’t tell.)  Also known as the giant redwood, this species has the most massive trunk and is one of the tallest trees in the world. The bark alone on older trees can be &gt; 1 foot thick! “General Sherman&quot;, which grows in Sequoia National Park and weighs more than 1000 tons, is said to be the largest living organism on Earth (although we can’t resist the temptation to point out that “Pando”, a clonal clump of aspen that grows near Fish Lake in Central Utah weighs in at a much larger 6 million kg). Redwoods can live for more than two thousand years.","cultivar":""},"75":{"id":75,"commonName":"Arizona Ash","scientificName":"Fraxinus velutina","family":"Oleacea","description":"Also called “velvet ash” or Modesto ash, this rounded tree reaches 30-40’ tall.  Its leaves turn a beautiful yellow in early fall.  Like most ashes, it is susceptible to borer damage.  Because roots grow near the surface, it should not be planted where damage to sidewalks or pavement can occur.","cultivar":""},"77":{"id":77,"commonName":"Western Water Birch","scientificName":"Betula occidentalis","family":"Betulaceae","description":"Our native cousin to the river birch, this tree has attractive cherry-like bark and stunning yellow fall color.  Water birches typically grow in vase-shaped, multi-stemmed trunks and reach only about 25&#39;.  Resistant to birch borers, this tree has a spectacular silhouette in both summer and winter if lower branches and suckers are removed.","cultivar":""},"78":{"id":78,"commonName":"Tuliptree","scientificName":"Liriodendron tulipifera","family":"Magnoliaceae","description":"The state tree of Indiana, this is one of the largest hardwoods in the Eastern U.S.  Its bright green, uniquely-shaped leaves turn a showy yellow in fall.  In May it produces attractive green-orange, tulip-shaped flowers, which give the tree its name. This tree prefers deep, rich, moist soil, with full sun and protection from the wind. It is intolerant of restricted root space, compacted soils, and very wet or very dry soils. (75’h x 40’w)","cultivar":""},"79":{"id":79,"commonName":"Thorny Honeylocust","scientificName":"Gleditsia triacanthos","family":"Fabaceae","description":"Check out the thorns!  This tree is very similar to the thornless variety (#21), except that it is laden with wicked, multi-branched thorns and is therefore not recommended for hugging, or landscape plantings.  Most cultivars found at a nursery are the thornless variety ‘inermis’, which is preferable for landscape use. ","cultivar":""},"80":{"id":80,"commonName":"Bald Cypress","scientificName":"Taxodium distichum","family":"Cupressaceae","description":"The trunks of these tall, pyramidal-shaped trees are strongly buttressed and they have cypress &quot;knees&quot; or woody projections of the roots that emerge from the water and may help in oxygen uptake for the roots.  This large, deciduous conifer has attractive, feathery foliage in summer, nice fall color, and an interesting shape and texture year-round. (75 ft h x 25 ft w)","cultivar":""},"81":{"id":81,"commonName":"Hackberry","scientificName":"Celtis occidentalis","family":"Ulmaceae","description":"This tree tolerates wind, alkaline soil, salts, moderate drought, and air pollution.  The oval-round form and large size fit nicely into a park or other large landscape planting. Edible 1/4-3/8&quot; red-purple fruits mature in early fall and can attract birds.  As hackberries mature, their bark looks increasingly dried and mud splattered.","cultivar":""},"82":{"id":82,"commonName":"Speckled Alder","scientificName":"Alnus rugosa","family":"Betulaceae","description":"This small, clumping tree (to 30&#39;) gets its name because of the large speckled lenticels (spongy white openings for gas exchange) on the dark brown or blackish bark.  Root nodules of Alders support nitrogen-fixing bacteria, thereby reducing any fertilizer requirement.","cultivar":""},"83":{"id":83,"commonName":"Quaking Aspen","scientificName":"Populus tremuloides","family":"Salicaceae","description":"Also native to Utah, this rapidly growing tree is adaptable to different soil types but requires plenty of moisture and full sun. The most striking features are its greenish-white bark and brilliant yellow fall color. It is most effective when planted in groupings or masses. Although it is used as a landscape tree, it is not recommended because of its numerous disease and insect problems. It also suckers readily in lawn and planter areas, and can lift sidewalks and window wells. For a similar landscape effect, plantings of ginkgo (#27) may be a better choice. ","cultivar":""},"84":{"id":84,"commonName":"American Beech","scientificName":"Fagus grandifolia","family":"Fagaceae","description":"This is one of our most graceful and noble trees, and could be used more in landscape situations where ample space is provided. It is large and sturdy, often with a short trunk and a wide spreading crown. The lower branches should be left to shade the lower trunk. It has smooth, light gray bark and produces rich yellow-bronze leaves and edible nuts in the fall. (60’h x 50’w)\r","cultivar":""},"85":{"id":85,"commonName":"Gambel Oak ","scientificName":"Quercus gambelii","family":"Fagaceae","description":"This tree graces our canyons and foothills and usually grows in dense clusters.  Following fire it resprouts profusely and in this form is referred to as “scrub oak.” This long-lived oak is appropriately sized for residential landscapes; it rarely exceeds 20’ in height.  Once established, it will tolerate drought and requires supplemental water only if faster growth is desired. This specimen does not exhibit the suckering habit commonly observed for this tree, and may be a cross with another white oak.","cultivar":""},"86":{"id":86,"commonName":"Pinyon Pine","scientificName":"Pinus edulis","family":"Pinaceae","description":"Pinyon (or pinion) pine is a small native pine found in many of our semi-deserts to the south and west. Pinyons tolerate drought and alkalinity, but prefer loose, well-drained soils. This slow-growing pine works well as a windbreak or screening tree and is an excellent choice for low-maintenance and water-conserving landscapes. It works well as a smaller pine for containing rock gardens. This tree is sometimes referred to as a Nut Pine, because its cones contain edible seeds. Typical size is 20’h x 20’w.","cultivar":""},"87":{"id":87,"commonName":"Russian Olive","scientificName":"Elaeagnus angustifolia","family":"Eleagnaceae","description":"This tree exhibits a leaning, gnarled appearance similar to the olive and is a common sight along ditches and canals. It has a striking silvery color and a picturesque form when it is maintained with heavy pruning. This tree is very adaptable and is able to withstand drought, heat, wind, compacted soil, and pollution. Use only with extreme caution.  (20’h x 20’w)","cultivar":""},"89":{"id":89,"commonName":"Pussy Willow","scientificName":"Salix discolor","family":"Salicaceae","description":"Pussy Willow is native to wet areas of the Eastern U.S. and is valued for the silky white catkins that emerge from dark red buds in the spring.  The stems and leaves of this tree are also covered with a soft white fuzz.  It grows with multiple trunks up to 30&#39;, but is usually pruned as a shrub in landscapes.  ","cultivar":""},"90":{"id":90,"commonName":"Black Walnut","scientificName":"Juglans nigra","family":"Juglandaceae","description":"This long-lived, rapid growing tree needs deep, rich, and moist soil to achieve maximum growth. It produces an edible fruit.  Walnuts withstand periods of drought and are often a good choice for parks and large areas, but they can inhibit the growth of some vegetables and flowers growing nearby. (75’h x 60’w)","cultivar":""},"91":{"id":91,"commonName":"Bigtooth Maple","scientificName":"Acer grandidentatum","family":"Aceraceae","description":"The spectacular red color in Utah canyons each fall is largely due to this cousin of the Sugar Maple (#112).  This tree is often multi-stemmed and somewhat shorter, with stout branches and an irregular crown.  It needs more moisture than Gambel Oak, but will tolerate some periods of drought.  This tree provides nice shade in park and campground settings. (40 ft h x 20 ft W)  ","cultivar":""},"92":{"id":92,"commonName":"Carolina Poplar","scientificName":"Populus canadensis","family":"Salicaceae","description":"This rapid-growing tree performs best in moist, fertile soils. It is able to survive in harsh city conditions, but has a bad reputation for roots that clog and break sewer lines. Like most fast growing trees, Carolina Poplars are weak wooded and can break during wind or storms. (100’h x 30’w)","cultivar":""},"93":{"id":93,"commonName":"Greenspire Linden","scientificName":"Tilia cordata 'Greenspire'","family":"Tiliaceae","description":"This medium-large tree maintains a strong single leader and a dense, pyramidal growth habit. It grows rapidly in sun or partial shade. Flowers emit a beautiful fragrance in June, and develop into great fruits that spin to earth like helicopters in the fall. Lindens are often planted as street trees, although they are not very tolerant of de-icing salts or prolonged drought. They are also plagued by aphids some years.","cultivar":""},"94":{"id":94,"commonName":"Kwanzan Cherry","scientificName":"Prunus serrulata 'Kwanzan'","family":"Rosaceae","description":"This elegant but short-lived small tree is best known for the outstanding double-petal pink flowers (but no fruit!) that emerge before the leaves in the spring. Leaves turn to a brilliant orange-bronze in autumn. This is a rapid growing tree that, when provided with adequate moisture and good soil drainage, will attain a spreading vase-shaped form of 15’ to 20’ in just a few years.","cultivar":""},"95":{"id":95,"commonName":"Bur Oak","scientificName":"Quercus macrocarpa","family":"Fagaceae","description":"This large decurrent tree has a magnificent spreading form.  It has a deeper root system making it a typically better lawn tree than the more commonly used Norway maples (#102). Other enchanting features of this tree include corky winged projections on young branches and the large acorns (1 ½ inches long) with curly fringes on the cap.  Children love to collect and play with these acorns. (65’h x 55’w)","cultivar":""},"96":{"id":96,"commonName":"Aristocrat Pear ","scientificName":"Pyrus calleryana 'Aristocrat'","family":"Rosaceae","description":"This fast-growing tree is remarkably adaptable. It is pest resistant and tolerates moderate drought, winds, poor drainage and just about any soil. Leaves are a dark, glossy green that turn to a deep, regal red in the fall. Its beautiful white flowers, one inch across, form in clusters in late March.  The “pear” produced is only about the size of a large pea and usually eaten by birds. ","cultivar":""},"97":{"id":97,"commonName":"Columnar Beech","scientificName":"Fagus sylvatica 'Fastigiata'","family":"Fagaceae","description":"This European beech cultivar has very upright branching.  Similar cultivars with bronze and purple leaf colors are available.  The bark does not peel with age but remains smooth and silvery gray.  It will not withstand soil compaction and is difficult to transplant. (60’h x 25’w)","cultivar":""},"98":{"id":98,"commonName":"Tricolor Beech","scientificName":"Fagus sylvatica 'Roseo-Marginata'","family":"Fagaceae","description":"This pyramidal tree is notable for its variegated leaves of green, white, and pink.  The leaf color will be more intense in a slightly acidic soil, and planting it in an area with afternoon shade will reduce leaf sunscald. The Tricolor beech is smaller than the weeping form, and is medium-sized in Utah County. <div style=\"display:none\">fiogf49gjkf05</div>","cultivar":""},"99":{"id":99,"commonName":"European Beech","scientificName":"Fagus sylvatica","family":"Fagaceae","description":"This slow-growing pyramidal tree is short-trunked with very low, spreading branches. It has smooth gray bark that contrasts with the glossy-green leaf. In the fall, the leaves turn to vivid yellows and reds. This is a great landscape tree, but it may be difficult to grow grass under its shade. ","cultivar":""},"100":{"id":100,"commonName":"Sweet Hackberry","scientificName":"Celtis laevigata","family":"Ulmaceae","description":"Also called sugarberry, this tree produces a sweet, juicy orange-red fruit that is relished by birds. Bright green leaves, which tend to be narrower than common hackberry (#78), turn a showy yellow in fall. The tree grows rapidly and requires skilled pruning when young to develop good structure. (55’h x 45’w)","cultivar":""},"101":{"id":101,"commonName":"Bristlecone Pine","scientificName":"Pinus aristata","family":"Pinaceae","description":"A native of the Rocky Mountains, this 5-needle pine grows very slowly; some reports indicated that it only increases an inch in diameter each century. It is drought tolerant and adaptable to wide variety of soil types, but requires some protection from drying winds. As it ages, this tree develops an irregular shape that is very picturesque. (15’h x 10’w)<div style=\"display:none\">fiogf49gjkf05</div>","cultivar":""},"102":{"id":102,"commonName":"Green Atlas Cedar","scientificName":"Cedrus atlantica","family":"Pinaceae","description":"This pyramidal tree is a beautiful wide-spreading evergreen. It needs plenty of space for optimal growth and best landscape use. It is drought tolerant, clean, and requires little care. It is reportedly less cold-hardy than other cedars and should probably be planted in a protected area in Utah County. (50’h x 40’w).","cultivar":""},"103":{"id":103,"commonName":"White Fir","scientificName":"Abies concolor","family":"Pinaceae","description":"This is one of the most conical trees around, generally keeping its perfect “Christmas tree” shape for decades!   This Rocky Mountain native, which could arguably replace Colorado blue spruce as our state tree, is moderately drought tolerant but does not tolerate poorly drained soils.  As with other firs, it tolerates considerable shade. Its soft appearance and silvery foliage add special year-round interest to the landscape. (85’ x 30’)\rNOTICE:  The current tour White Fir was removed July, 2009.","cultivar":""},"104":{"id":104,"commonName":"American Sycamore","scientificName":"Platanus occidentalis","family":"Platanaceae","description":"Single fuzzball fruits, twigs that zigzag between buds, and a central leaf lobe that tends to be broader than long help distinguish American sycamore from the London plane tree (tree # 18 on the tour). Fruits of both trees mature in autumn and remain on the tree most of the winter. Sycamores usually have a massive trunk with thin, brown, green, tan and white mottled bark. ","cultivar":""},"105":{"id":105,"commonName":"Norway Maple","scientificName":"Acer plantanoides","family":"Aceraceae","description":"This is probably the most common shade tree planted in central Utah landscapes.  It is a large, round, hardy tree that is well-adapted to city conditions and has small, yellow-green flower clusters that are produced before the dark green leaves.  A broken petiole exudes a white milky sap which distinguishes it from other maples. Shallow rooting may cause problems in lawns, sidewalks, or other structures.  ","cultivar":""},"106":{"id":106,"commonName":"Bosnian Red Cone Pine ","scientificName":"Pinus leucodermis","family":"Pinaceae","description":"This is a slow-growing tree that matures at about 20’ high and 10’ wide.  It is ideal for those who want a small, tightly pyramidal pine in the landscape. This tree tolerates heavy clay soils as long as drainage is good.","cultivar":""},"107":{"id":107,"commonName":"Chinese Elm","scientificName":"Ulmus parvifolia","family":"Ulmaceae","description":"This rapid growing tree is adaptable and able to grow well in most soils. It requires little maintenance and is quite attractive with fine textured foliage and beautiful bark. It tolerates heat and poor soils and is resistant to Dutch elm disease. This is an outstanding ornamental shade tree, not to be confused with the Siberian elm (#57) that is often mistakenly referred to by the same name. (45’h x 55’w)","cultivar":""},"108":{"id":108,"commonName":"Arnold Tulip Tree","scientificName":"Liriodendron tulipifera 'Arnold'","family":"Magnoliaceae","description":"This narrow oval tree grows rapidly and produces upright magnolia-like flowers (yellowish green and orange) in late spring. Blossoms have a pleasant fragrance and attract hummingbirds and butterflies.  Fall color is a golden yellow.  (60’h x 30’w)","cultivar":""},"109":{"id":109,"commonName":"Dawyck Purple Beech","scientificName":"Fagus sylvatica 'Dawyck Purple'","family":"Fagaceae","description":"This upright beech retains its purple leaf color well into the summer.  It matures at about 40&#39; by 12&#39;.  Due to Utah&#39;s low humidity and high light intensity, leaves of this and other purple-leaved trees tend to sunscald in mid to late summer. Planting this tree in afternoon shade seems to alleviate this problem. ","cultivar":""},"110":{"id":110,"commonName":"Columnar English Oak","scientificName":"Quercus robur 'Fastigiata'","family":"Fagaceae","description":"This tree produces lustrous, dark green foliage in the summer and retains its leaves through winter until bud break. The form remains narrow and upright, making this tree an excellent choice for a narrow space. It is highly susceptible to herbicide damage.  (50’h x 15’w)","cultivar":""},"111":{"id":111,"commonName":"Village Green Zelkova","scientificName":"Zelkova serrata 'Village Green'","family":"Ulmaceae","description":"This tree has no pest problems and is very handsome with a slightly weeping vase shape. Fall leaf color, a red-bronze, is excellent.  This variety grows a little larger and faster than other Zelkovas and should be used more often. (55’h x 45’w)","cultivar":""},"112":{"id":112,"commonName":"Pyramidal European Hornbeam","scientificName":"Carpinus betulus 'Fastigiata'","family":"Betulaceae","description":"This dense, conical tree will grow in full sun to light shade in most soils. It has an excellent formal shape and requires little care.  Its wood is very dense, and is believed to have been used anciently for Roman chariots. ","cultivar":""},"113":{"id":113,"commonName":"Royalty Crabapple","scientificName":"Malus x royalty","family":"Rosaceae","description":"This broadly rounded tree produces flower buds that are deep pink fading to white as they open.  Fruit is persistant through most of winter and is eaten by birds.  It is susceptible to black aphids and fireblight, as well as scab and powdery mildew.  (15-20&#39;h x 20&#39;w)","cultivar":""},"114":{"id":114,"commonName":"Spring Snow Crabapple","scientificName":"Malus x 'Spring Snow'","family":"Rosaceae","description":"Finally, a fruitless crabapple!  This upright, oval tree produces spectacular white blossoms in the spring and matures at about 25’ x 15’.  It is ideally suited to grace a patio or entry. This cultivar is susceptible to scab, fireblight, and rust.","cultivar":""},"115":{"id":115,"commonName":"Sugar Maple","scientificName":"Acer saccharum 'Green mountain'","family":"Aceraceae","description":"This is the tree most famous for the spectacular fall color in the northeastern U.S.  Foliage is a medium, dark green in the summer that changes to brilliant oranges and reds. Sugar maples struggle with Utah soils and climate.  Our own native bigtooth maple, which has a basically similar form (upright oval) and fall color, is probably a better choice here. (50’h x 30’w)","cultivar":""},"116":{"id":116,"commonName":"Sargeant Crabapple","scientificName":"Malus sargentii","family":"Rosaceae","description":"This diminutive ornamental has delightful red blossoms in the spring which open to expose white flowers.  The small red fruit that develops is enjoyed by birds.  It is a low growing tree with a wonderful winter form.  (8’h x 12’w)","cultivar":""},"119":{"id":119,"commonName":"Columnar Elm","scientificName":"Ulmus americana columnaris","family":"Ulmaceae","description":"The Columnar Elm is a fairly new horticultural cultivar similar to the American Elm (#54).  It has an upright growth habit in contrast with the standard American Elm.  (50’h x 20’ w)","cultivar":""},"122":{"id":122,"commonName":"English Walnut","scientificName":"Juglans Regia","family":"Juglandaceae","description":"This is the tree from which commercial walnuts are produced.  Nuts have a much softer shell and are larger than those of black walnut. While it can be a nice landscape tree, keep in mind that fruits, flowers and leaves all drop when it is windy, which can clog rain gutters and produce a constant mess throughout the growing season.   A husk fly occasionally infests the nuts. (50’h x 50’w, round crown) ","cultivar":""},"124":{"id":124,"commonName":"Euonymus (SHRUB)","scientificName":"Euonymus alatus","family":"Celastraceae","description":"","cultivar":""},"125":{"id":125,"commonName":"Japanese Barberry (SHRUB)","scientificName":"Berberis thunbergii atropurpurea","family":"Berberidaceae","description":"","cultivar":""},"127":{"id":127,"commonName":"Forsythia (SHRUB)","scientificName":"Forsythia intermedia 'Lynwood Gold'","family":"Oleaceae","description":"","cultivar":""},"128":{"id":128,"commonName":"Japanese Yew (SHRUB)","scientificName":"Taxus cuspidata","family":"Taxaceae","description":"","cultivar":""},"129":{"id":129,"commonName":"Cotoneaster (SHRUB)","scientificName":"Cotoneaster horizontalis","family":"Rosaceae","description":"","cultivar":""},"130":{"id":130,"commonName":"Oregon Grape (SHRUB)","scientificName":"Berberis aquifolium","family":"Berberidaceae","description":"","cultivar":""},"131":{"id":131,"commonName":"Red Twig Dogwood (SHRUB)","scientificName":"Cornus sericea 'Baileyi'","family":"Cornaceae","description":"","cultivar":""},"132":{"id":132,"commonName":"Common Privet (SHRUB)","scientificName":"Ligustrum vulgara 'Cheyenne'","family":"Oleaceae","description":"","cultivar":""}}};

const R = 6371000, rad = d => d*Math.PI/180, deg = r => r*180/Math.PI;
function dist(a,b){const dLa=rad(b.lat-a.lat),dLo=rad(b.lng-a.lng);const h=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function bearing(a,b){const y=Math.sin(rad(b.lng-a.lng))*Math.cos(rad(b.lat));const x=Math.cos(rad(a.lat))*Math.sin(rad(b.lat))-Math.sin(rad(a.lat))*Math.cos(rad(b.lat))*Math.cos(rad(b.lng-a.lng));return (deg(Math.atan2(y,x))+360)%360}
