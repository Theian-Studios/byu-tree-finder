const dirURL = t => `https://www.google.com/maps/dir/?api=1&destination=${t.lat},${t.lng}&travelmode=walking`;

/* ---------- map adapters ---------- */
function treeDot(){const d=document.createElement("div");d.className="tmark";return d}
function meDot(){const d=document.createElement("div");d.className="mewrap";d.innerHTML='<div class="cone" id="cone"></div><div class="me"></div>';return d}
function freshMapDiv(){const old=document.getElementById("map");const d=document.createElement("div");d.id="map";d.setAttribute("role","application");d.setAttribute("aria-label","Map of BYU campus trees");old.replaceWith(d);return d}

function loadScript(src){return new Promise((ok,fail)=>{const s=document.createElement("script");s.src=src;s.async=true;s.onload=ok;s.onerror=()=>fail(Error("load "+src));document.head.append(s)})}

async function googleMap(){
  if(!CFG.googleKey || CFG.googleKey.startsWith("YOUR")) throw Error("no Google key set");
  await new Promise((ok,fail)=>{
    window.__gmReady = ok;
    loadScript(`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(CFG.googleKey)}&v=weekly&loading=async&callback=__gmReady`).catch(fail);
    setTimeout(()=>fail(Error("Google Maps timed out")),15000);
  });
  const [{Map:GMap},{AdvancedMarkerElement:AM}] = await Promise.all([google.maps.importLibrary("maps"),google.maps.importLibrary("marker")]);
  const map = new GMap(document.getElementById("map"),{
    center:CENTER, zoom:16, mapId:CFG.mapId, colorScheme:"FOLLOW_SYSTEM",
    disableDefaultUI:true, clickableIcons:false, gestureHandling:"greedy",
    keyboardShortcuts:false, maxZoom:21, tilt:0, mapTypeId:satOn?"hybrid":"roadmap"
  });
  // AdvancedMarker anchors content bottom-center; shift so the dot's center sits on the point
  const centered = el => {const w=document.createElement("div");w.style.transform="translateY(50%)";w.append(el);return w};
  let meM=null, acc=null;
  return {
    kind:"google",
    setView(lat,lng,minZ){ if(minZ && map.getZoom()<minZ) map.setZoom(minZ); map.panTo({lat,lng}) },
    onUserDrag(fn){ map.addListener("dragstart",fn) },
    sat(on){ map.setMapTypeId(on?"hybrid":"roadmap") },
    addTree(t,onTap){
      const dot=treeDot();
      const m=new AM({map,position:{lat:t.lat,lng:t.lng},content:centered(dot),title:t.name,gmpClickable:true});
      m.addEventListener("gmp-click",onTap);
      return dot;
    },
    setMe(p){
      const ll={lat:p.lat,lng:p.lng};
      if(!meM){
        meM=new AM({map,position:ll,content:centered(meDot()),zIndex:1000});
        acc=new google.maps.Circle({map,center:ll,radius:p.acc,strokeColor:"#1A73E8",strokeWeight:1,strokeOpacity:.6,fillColor:"#1A73E8",fillOpacity:.1,clickable:false});
      }else{ meM.position=ll; acc.setCenter(ll); acc.setRadius(p.acc) }
    },
    resize(){}
  };
}

async function leafletMap(){
  if(!window.L){
    const css=document.createElement("link");css.rel="stylesheet";css.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";document.head.append(css);
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js");
  }
  const map = L.map("map",{zoomControl:false,attributionControl:true}).setView([CENTER.lat,CENTER.lng],16);
  const street = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:20,maxNativeZoom:19,attribution:"© OpenStreetMap"});
  const sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:20,maxNativeZoom:19,attribution:"Imagery © Esri"});
  (satOn?sat:street).addTo(map);
  let meM=null, acc=null;
  return {
    kind:"leaflet",
    setView(lat,lng,minZ){ map.setView([lat,lng],Math.max(map.getZoom(),minZ||0),{animate:true}) },
    onUserDrag(fn){ map.on("dragstart",fn) },
    sat(on){ map.removeLayer(on?street:sat); (on?sat:street).addTo(map) },
    addTree(t,onTap){
      const m=L.marker([t.lat,t.lng],{icon:L.divIcon({className:"",html:'<div class="tmark"></div>',iconSize:[16,16],iconAnchor:[8,8]}),title:t.name,keyboard:true}).addTo(map);
      m.on("click",onTap);
      return m.getElement().firstChild;
    },
    setMe(p){
      if(!meM){
        meM=L.marker([p.lat,p.lng],{icon:L.divIcon({className:"",html:meDot().outerHTML,iconSize:[22,22],iconAnchor:[11,11]}),interactive:false,zIndexOffset:1000}).addTo(map);
        acc=L.circle([p.lat,p.lng],{radius:p.acc,color:"#1A73E8",weight:1,fillOpacity:.1,interactive:false}).addTo(map);
      }else{ meM.setLatLng([p.lat,p.lng]); acc.setLatLng([p.lat,p.lng]).setRadius(p.acc) }
    },
    resize(){ map.invalidateSize() }
  };
}

function wireMap(){
  mv.onUserDrag(()=>setFollow(false));
  treeEls.clear();
  trees.forEach(t=>treeEls.set(t.id, mv.addTree(t,()=>choose(t,true))));
  if(me) mv.setMe(me);
  restyleMarkers(); update();
}
let fellBack=false;
async function useLeaflet(why){
  if(fellBack) return; fellBack=true;
  console.warn("Google Maps unavailable, using OpenStreetMap:",why);
  freshMapDiv();
  mv = await leafletMap();
  if(dataReady) wireMap();
}
// Google calls this if the key is wrong or this URL isn't on the key's allowed list
window.gm_authFailure = () => useLeaflet("key rejected for this site");
async function initMap(){
  try{ mv = await googleMap() }catch(e){ return useLeaflet(e.message) }
  if(fellBack) return;
  if(dataReady) wireMap();
}


/* ---------- data ---------- */
let dataReady=false;
function clean(list){return list.filter(t=>t.latitude>40&&t.latitude<41&&t.longitude<-111&&t.longitude>-112).map(t=>({id:t.id,name:dec(t.commonName),sci:dec(t.scientificName),lat:+t.latitude,lng:+t.longitude,type:t.treeTypeId,img:t.mainImage||""}))}
async function load(){
  let tlist = SNAPSHOT.trees, tmap = SNAPSHOT.types;
  try{
    const [a,b] = await Promise.all([fetch(API+"/trees").then(r=>r.json()),fetch(API+"/TreeTypes").then(r=>r.json())]);
    if(a&&Array.isArray(a.value)&&a.value.length) tlist=a.value;
    if(b&&Array.isArray(b.value)&&b.value.length){tmap={};b.value.forEach(t=>tmap[t.id]=t)}
  }catch(e){/* offline or blocked: use built-in copy */}
  trees = clean(tlist); types = {};
  for(const k in tmap){const y=tmap[k];types[k]={...y,family:dec(y.family),description:dec(y.description),cultivar:dec(y.cultivar)}}
  dataReady=true;
  if(mv) wireMap();
  renderList();
}

/* ---------- location ---------- */
function startLocation(){
  if(!("geolocation" in navigator)){showErr("This browser can’t share your location.");return}
  askCompass();
  document.getElementById("status").textContent="Finding you…";
  watchId = navigator.geolocation.watchPosition(onPos,e=>{
    const msg = e.code===1 ? "Location is blocked. Allow location for this site in your browser settings, then reload."
      : e.code===3 ? "Still looking for GPS. Step outside or away from tall buildings." : "Couldn’t get your location. Try again in a moment.";
    showErr(msg);
  },{enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  document.getElementById("actions").hidden=true;
  setFollow(true);
}
function showErr(m){const e=document.getElementById("err");e.textContent=m;e.style.display="block"}
function onPos(p){
  document.getElementById("err").style.display="none";
  me={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy};
  if(heading==null && p.coords.heading!=null && !isNaN(p.coords.heading) && p.coords.speed>0.7) heading=p.coords.heading; // walking direction fallback
  if(mv) mv.setMe(me);
  if(follow && mv) mv.setView(me.lat,me.lng,18);
  if(!manualTarget) target = nearest();
  update(); renderList();
}
function nearest(){let best=null,bd=Infinity;for(const t of trees){const d=dist(me,t);if(d<bd){bd=d;best=t}}return best}
// Follow is automatic. Panning the map or picking a tree pauses it; it picks back up after 15 s.
let resumeT=0;
function setFollow(on){follow=on;clearTimeout(resumeT);if(on){if(me&&mv)mv.setView(me.lat,me.lng,18)}else if(me)resumeT=setTimeout(()=>setFollow(true),15000)}
document.getElementById("locBtn").onclick=startLocation;

/* ---------- compass ---------- */
function askCompass(){
  const D=window.DeviceOrientationEvent;
  if(!D) return;
  if(typeof D.requestPermission==="function"){ // iOS: must be called from a tap
    D.requestPermission().then(s=>{if(s==="granted")listenCompass()}).catch(()=>{});
  }else listenCompass();
}
function listenCompass(){
  const h=e=>{
    let hd=null;
    if(typeof e.webkitCompassHeading==="number") hd=e.webkitCompassHeading;
    else if(e.absolute && e.alpha!=null) hd=(360-e.alpha)%360;
    if(hd!=null){hd=(hd+screenAngle())%360;heading=hd;spin()}
  };
  window.addEventListener("deviceorientationabsolute",h,true);
  window.addEventListener("deviceorientation",h,true);
}
const screenAngle=()=>(screen.orientation&&screen.orientation.angle)||window.orientation||0;
let raf=0;function spin(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;update(true)})}

/* ---------- UI ---------- */
function restyleMarkers(){
  const s=(document.getElementById("q").value||"").trim().toLowerCase();
  treeEls.forEach((el,id)=>{
    const t=trees.find(x=>x.id===id);
    el.classList.toggle("target",!!target&&id===target.id);
    el.classList.toggle("dim",!!s&&!(t.name+" "+t.sci).toLowerCase().includes(s));
  });
}
function update(light){
  const arrow=document.getElementById("arrow"), cone=document.getElementById("cone");
  if(cone&&heading!=null){cone.style.display="block";cone.style.transform=`rotate(${heading}deg)`}
  if(!target){return}
  const t=target;
  document.getElementById("moreBtn").hidden=false;
  if(countFor!==t.id){countFor=t.id;moreLabel();loadPhotos(t).then(()=>{if(target===t)moreLabel()})}
  if(sheet.classList.contains("open")&&detailFor!==t.id) renderDetail(t);
  sheet.classList.toggle("nofix",!me);
  if(!me){ // picked a tree before turning on location
    if(light) return;
    setText(t);document.getElementById("status").textContent="Use your location to see how far away it is.";
    return;
  }
  const d=dist(me,t), b=bearing(me,t);
  const rel = heading==null ? b : (b-heading+360)%360;
  arrow.style.transform=`rotate(${rel}deg)`;
  document.getElementById("orbit").style.transform=`rotate(${rel}deg)`;
  {const dial=document.getElementById("dial"),di=document.getElementById("dialImg");
   if(t.img){const src=IMG+encodeURIComponent(t.img);if(di.dataset.src!==src){di.dataset.src=src;di.src=src;di.onerror=()=>dial.classList.remove("photo")}dial.classList.add("photo")}
   else dial.classList.remove("photo");}
  document.getElementById("cardinal").textContent = heading==null ? "N" : "";
  if(light) return;
  const [n,u]=fmt(d);
  const here = d <= Math.max(HERE_M, Math.min(me.acc,25));
  document.getElementById("dist").innerHTML = here ? "" : `${n}<span>${u} away</span>`;
  document.getElementById("dial").classList.toggle("here",here);
  setText(t);
  document.getElementById("status").textContent = here ? "" :
    (me.acc>15?"Weak GPS signal, distance may be off":"");
  document.getElementById("badge").innerHTML = here ? '<span class="hereBadge">You’re at this tree</span>' : "";
  if(here && !arrived.has(t.id)){arrived.add(t.id); say("You’re at the "+t.name+"."); if(ARRIVE_BUZZ&&navigator.vibrate) navigator.vibrate([80,60,80])}
  restyleMarkers();
}
let lastSaid="";function say(s){if(s===lastSaid)return;lastSaid=s;document.getElementById("sr").textContent=s}
function setText(t){if(document.getElementById("tname").textContent!==t.name)say(t.name);document.getElementById("tname").textContent=t.name;document.getElementById("sci").textContent=t.sci}
function choose(t,manual){
  target=t;manualTarget=manual;update();renderDetail(t);restyleMarkers();
  if(manual)setFollow(false);
}
function flyTo(t){mv&&mv.setView(t.lat,t.lng,18)}
function renderDetail(t){
  const ty=types[t.type]||{};
  const plantedHere = trees.filter(x=>x.type===t.type).length;
  detailFor=t.id;
  const main = t.img?`<a href="${IMG}${encodeURIComponent(t.img)}" target="_blank" rel="noopener"><img src="${IMG}${encodeURIComponent(t.img)}" alt="${esc(t.name)}"></a>`:"";
  document.getElementById("detail").innerHTML = `
    <div class="tabs" role="tablist" aria-label="Tree details">
      <button role="tab" data-tab="about" aria-selected="true">About</button>
      <button role="tab" data-tab="photos" aria-selected="false">Photos</button>
      <button role="tab" data-tab="nearby" aria-selected="false">Nearby</button>
    </div>
    <div role="tabpanel" data-pane="about">
      ${t.img?`<a href="${IMG}${encodeURIComponent(t.img)}" target="_blank" rel="noopener"><img class="hero" src="${IMG}${encodeURIComponent(t.img)}" alt="${esc(t.name)}"></a>`:""}
      <table class="facts"><tbody>
        ${ty.family?`<tr><th scope="row">Family</th><td>${esc(ty.family)}</td></tr>`:""}
        <tr><th scope="row">On campus</th><td>${plantedHere} ${plantedHere===1?"tree":"trees"}</td></tr>
        <tr><th scope="row">Scientific name</th><td><i>${esc(t.sci)}</i></td></tr>
        ${ty.cultivar?`<tr><th scope="row">Cultivar</th><td>${esc(ty.cultivar)}</td></tr>`:""}
      </tbody></table>
      <p>${esc(ty.description||"")}</p>
      <p class="meta"><a href="${dirURL(t)}" target="_blank" rel="noopener">Walking directions</a></p>
      <p class="meta"><a href="${SITE}/trees/${t.type}" target="_blank" rel="noopener">Care notes on BYU Tree Tours</a></p>
    </div>
    <div role="tabpanel" data-pane="photos" hidden><div class="pgrid">${main}<div id="strip" style="display:contents"></div></div></div>`;
  showTab("about");
  loadPhotos(t);
}
function showTab(name){
  const more=document.getElementById("more"); more.dataset.tab=name;
  document.querySelectorAll("#detail [data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===name));
  document.querySelectorAll("#detail [data-pane]").forEach(p=>p.hidden=p.dataset.pane!==name);
  more.scrollTop=0;
}
document.getElementById("detail").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)showTab(b.dataset.tab)});
let detailFor=null; const photoCache=new Map();
async function loadPhotos(t){
  let list=photoCache.get(t.id);
  if(!list){
    list=[];
    try{
      const r=await fetch(API+"/Trees/photos/"+t.id).then(r=>r.json());
      list=(r.value||[]).map(p=>({src:p.imageUrl,cap:dec(p.caption||""),credit:dec(p.credit||"")}));
      if(!list.length){
        const s=await fetch(API+"/TreeTypes/images/"+t.type).then(r=>r.json());
        list=(s.value||[]).map(src=>({src,cap:"",credit:""}));
      }
    }catch(e){}
    list=list.filter(p=>p.src&&p.src!==t.img);
    photoCache.set(t.id,list);
  }
  const el=document.getElementById("strip");
  if(!el||detailFor!==t.id) return;
  el.innerHTML=list.map(p=>`<a href="${IMG}${encodeURIComponent(p.src)}" target="_blank" rel="noopener"${p.credit?` title="Photo: ${esc(p.credit)}"`:""}><img src="${IMG}${encodeURIComponent(p.src)}" alt="${esc(p.cap||t.name)}" loading="lazy">${p.cap?`<span>${esc(p.cap)}</span>`:""}</a>`).join("");
}
function renderList(){
  const list=document.getElementById("list");
  let arr=trees.slice();
  if(me){arr.forEach(t=>{t._d=dist(me,t);t._b=bearing(me,t)});arr.sort((a,b)=>a._d-b._d);arr=arr.slice(0,5);document.getElementById("nearTitle").textContent="Closest to you"}
  else arr.sort((a,b)=>a.name.localeCompare(b.name));
  list.innerHTML=arr.map(t=>`<div class="rowwrap"><button class="row" data-id="${t.id}">
    <svg width="24" height="24" viewBox="0 0 24 24" style="transform:rotate(${me?((t._b-(heading||0)+360)%360):0}deg)"><path d="${me?"M12 3 18 19 12 15 6 19Z":"M12 2c4 3 6 6 6 9a6 6 0 0 1-12 0c0-3 2-6 6-9Zm0 13v7"}" fill="${me?"currentColor":"none"}" stroke="currentColor" stroke-width="${me?0:2}"/></svg>
    <span><b>${esc(t.name)}</b><i>${esc(t.sci)}</i></span>
    <span class="d">${me?fmt(t._d).join(" "):""}</span></button>
    <a class="go" href="${dirURL(t)}" target="_blank" rel="noopener" aria-label="Walking directions to ${esc(t.name)}" title="Directions"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2 22 12 12 22 2 12Z"/><path d="M9 14v-3h5m-2-2 2 2-2 2"/></svg></a></div>`).join("");
}
document.getElementById("list").onclick=e=>{const b=e.target.closest(".row");if(!b)return;const t=trees.find(x=>x.id==b.dataset.id);choose(t,true);flyTo(t)};

/* sheet open/close */
const sheet=document.getElementById("sheet");
const sheetTop=document.getElementById("sheetTop"), moreEl=document.getElementById("more");
let sheetY=0, dragging=null, eatClick=false, countFor=null;
const isOpen=()=>sheet.classList.contains("open");
function moreLabel(){
  const n=target?(target.img?1:0)+((photoCache.get(target.id)||[]).length):0;
  document.getElementById("moreLabel").textContent=isOpen()?"Hide details":"Photos and details";
}
// how far down the sheet slides when collapsed: everything except the top part stays off screen
function closedY(){const pb=parseFloat(getComputedStyle(sheet).paddingBottom)||0;return Math.max(0,sheet.offsetHeight-sheetTop.offsetHeight-pb)}
function setY(y){sheetY=y;sheet.style.setProperty("--sheetY",y+"px")}
function layout(){
  if(!dragging) setY(isOpen()?0:closedY());
  // keep the map (and its Google logo) above the collapsed sheet
  const pb=parseFloat(getComputedStyle(sheet).paddingBottom)||0, root=document.documentElement.style, v=(sheetTop.offsetHeight+pb)+"px";
  if(root.getPropertyValue("--mapB")!==v){root.setProperty("--mapB",v);mv&&mv.resize()}
}
function toggleSheet(force){
  const o=force===undefined?!isOpen():!!force;
  if(o&&target&&detailFor!==target.id) renderDetail(target);
  sheet.classList.toggle("open",o); moreEl.inert=!o;
  document.getElementById("grab").setAttribute("aria-expanded",o);
  document.getElementById("moreBtn").setAttribute("aria-expanded",o);
  moreLabel(); layout();
}
// drag the top of the sheet (handle, compass card, buttons) up or down; it follows your finger
sheetTop.addEventListener("pointerdown",e=>{if(e.button>0)return;dragging={y0:e.clientY,base:sheetY,moved:false,id:e.pointerId,pts:[[e.timeStamp,e.clientY]]}});
sheetTop.addEventListener("pointermove",e=>{
  const d=dragging; if(!d) return;
  const dy=e.clientY-d.y0;
  if(!d.moved){
    if(Math.abs(dy)<8) return;
    d.moved=true; sheetTop.setPointerCapture(d.id); sheet.classList.add("dragging");
    if(target&&detailFor!==target.id){renderDetail(target);d.base=isOpen()?0:closedY()}
  }
  setY(Math.min(closedY(),Math.max(0,d.base+dy)));
  d.pts.push([e.timeStamp,e.clientY]); if(d.pts.length>5) d.pts.shift();
});
function endDrag(){
  const d=dragging; dragging=null; if(!d||!d.moved) return;
  sheet.classList.remove("dragging"); eatClick=true; setTimeout(()=>eatClick=false,50);
  const [t0,y0]=d.pts[0],[t1,y1]=d.pts[d.pts.length-1], v=(y1-y0)/Math.max(1,t1-t0);
  toggleSheet(v<-0.3?true:v>0.3?false:sheetY<closedY()/2);
}
sheetTop.addEventListener("pointerup",endDrag);
sheetTop.addEventListener("pointercancel",endDrag);
sheetTop.addEventListener("click",e=>{if(eatClick){e.stopPropagation();e.preventDefault()}},true);
document.getElementById("grab").onclick=()=>toggleSheet();
document.getElementById("moreBtn").onclick=()=>toggleSheet();
document.getElementById("compass").onclick=()=>{if(target)toggleSheet()};
new ResizeObserver(layout).observe(sheet);
new ResizeObserver(layout).observe(sheetTop);

/* search */
const q=document.getElementById("q"),res=document.getElementById("results");
q.addEventListener("input",()=>{
  const s=q.value.trim().toLowerCase();
  restyleMarkers();
  if(!s){res.style.display="none";return}
  let hits=trees.filter(t=>(t.name+" "+t.sci).toLowerCase().includes(s));
  if(me) hits.sort((a,b)=>dist(me,a)-dist(me,b));
  res.innerHTML=hits.slice(0,20).map(t=>`<button data-id="${t.id}"><span><b>${esc(t.name)}</b><i>${esc(t.sci)}</i></span><span class="d">${me?fmt(dist(me,t)).join(" "):""}</span></button>`).join("")||'<div style="padding:12px 14px;color:var(--muted)">No trees match that name.</div>';
  res.style.display="block";
});
res.onclick=e=>{const b=e.target.closest("button");if(!b)return;const t=trees.find(x=>x.id==b.dataset.id);res.style.display="none";q.blur();choose(t,true);flyTo(t)};
document.addEventListener("click",e=>{if(!e.target.closest(".results,.search"))res.style.display="none"});

initMap();
load();
</script>
